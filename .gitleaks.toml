[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "The Phase 13 integration test imports a separately declared synthetic secret."
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^apps/api/tests/test_phase13_integration\.py$''']
  regexes = ['''phase7_tests\.SECRET''']

  [[rules.allowlists]]
  description = "The historical CI Qdrant fixture is synthetic and disposable."
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^\.github/workflows/ci\.yml$''']
  regexes = ['''phase6-ci-compose-key-0123456789''']

  [[rules.allowlists]]
  description = "The adapter contract documents a forbidden file suffix, not a secret."
  condition = "AND"
  regexTarget = "line"
  paths = ['''^docs/adapter-registry\.md$''']
  regexes = ['''\.pth''']

  [[rules.allowlists]]
  description = "The historical PostgreSQL test fixtures are synthetic and are not credentials."
  condition = "AND"
  regexTarget = "secret"
  paths = ['''^apps/api/tests/test_phase[3-9]_postgres\.py$''']
  regexes = ['''phase-[3-9]-test-secret-0123456789-abcdefghijklmnopqrstuvwxyz''']

[[rules]]
id = "curl-auth-header"

  [[rules.allowlists]]
  description = "Historical CI authorization headers use disposable synthetic tokens."
  condition = "AND"
  regexTarget = "match"
  paths = ['''^\.github/workflows/ci\.yml$''']
  regexes = [
    '''phase12-ci-production-runtime-token-0123456789''',
    '''phase7-ci-runtime-token-0123456789-abcdef''',
  ]
