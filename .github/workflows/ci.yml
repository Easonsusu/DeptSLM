name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-policy:
    name: Repository artifact policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject forbidden tracked artifacts
        shell: bash
        run: |
          set -euo pipefail
          violations=0

          while IFS= read -r -d '' path; do
            normalized_path="/${path}"

            case "${normalized_path}" in
              */runtime/*|*/.runtime/*|*/uploads/*|*/extracted_text/*|*/vector_snapshots/*|*/training_datasets/*|*/adapters/*|*/model_cache/*|*/eval_results/*|*/logs/*|*/exports/*|*/service_state/*|*/postgres-data/*|*/qdrant_storage/*|*/.docker-data/*|*/.huggingface/*|*/.ollama/*|*/model_weights/*|*/models-cache/*|*/node_modules/*|*/.next/*|*/__pycache__/*|*/.pytest_cache/*|*/.ruff_cache/*|*/.pnpm-store/*|*/.venv/*)
                printf 'Forbidden tracked artifact path: %s\n' "${path}" >&2
                violations=1
                ;;
            esac

            case "${path}" in
              *.safetensors|*.bin|*.gguf|*.ggml|*.pt|*.pth|*.ckpt|*.onnx|*.h5|*.tflite|*.db|*.db-shm|*.db-wal|*.sqlite|*.sqlite3|*.log)
                printf 'Forbidden tracked artifact file: %s\n' "${path}" >&2
                violations=1
                ;;
            esac

            case "${path}" in
              .env|.env.*|*/.env|*/.env.*)
                case "${path}" in
                  .env.example|*/.env.example) ;;
                  *)
                    printf 'Forbidden tracked environment file: %s\n' "${path}" >&2
                    violations=1
                    ;;
                esac
                ;;
            esac
          done < <(git ls-files -z)

          exit "${violations}"
      - name: Verify policy check leaves the checkout clean
        shell: bash
        run: |
          status_file="${RUNNER_TEMP}/git-status"
          git status --porcelain --untracked-files=all > "${status_file}"
          if [[ -s "${status_file}" ]]; then
            cat "${status_file}" >&2
            exit 1
          fi

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @deptslm/web typecheck
      - run: pnpm --filter @deptslm/web test
      - run: pnpm --filter @deptslm/web build
      - name: Verify web checks leave the checkout clean
        shell: bash
        run: |
          status_file="${RUNNER_TEMP}/git-status"
          git status --porcelain --untracked-files=all > "${status_file}"
          if [[ -s "${status_file}" ]]; then
            cat "${status_file}" >&2
            exit 1
          fi

  api:
    name: API, worker, and storage checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deptslm_test
          POSTGRES_PASSWORD: deptslm
          POSTGRES_USER: deptslm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deptslm -d deptslm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.4
        env:
          QDRANT__SERVICE__API_KEY: phase6-ci-qdrant-key-0123456789
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+psycopg://deptslm:deptslm@localhost:5432/deptslm_test
      DATABASE_TEST_URL: postgresql+psycopg://deptslm:deptslm@localhost:5432/deptslm_test
      DEPTSLM_REQUIRE_POSTGRES_TESTS: "1"
      DEPTSLM_REQUIRE_QDRANT_TESTS: "1"
      DEPTSLM_TEST_QDRANT_URL: http://localhost:6333
      DEPTSLM_TEST_QDRANT_API_KEY: phase6-ci-qdrant-key-0123456789
      DEPTSLM_TEST_QDRANT_ISOLATED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
            services/rag-worker/pyproject.toml
            services/rag-runtime/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
        working-directory: apps/api
      - name: Check Python dependency consistency
        working-directory: apps/api
        run: python -m pip check
      - name: Lint API
        working-directory: apps/api
        run: |
          python -m ruff check app tests ../../services/rag-worker/deptslm_worker ../../services/rag-runtime/deptslm_runtime
          python -m ruff format --check app tests ../../services/rag-worker/deptslm_worker ../../services/rag-runtime/deptslm_runtime
      - name: Run API tests with temporary storage
        working-directory: apps/api
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-data"
          export CODE_REVISION="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          mkdir -p "$DEPTSLM_DATA_DIR/uploads" "$DEPTSLM_DATA_DIR/extracted_text" "$DEPTSLM_DATA_DIR/eval_results" "$DEPTSLM_DATA_DIR/model_cache" "$DEPTSLM_DATA_DIR/adapters" "$DEPTSLM_DATA_DIR/adapters/imports" "$DEPTSLM_DATA_DIR/adapters/registry" "$DEPTSLM_DATA_DIR/adapters/.staging/imports" "$DEPTSLM_DATA_DIR/adapters/.staging/registry" "$DEPTSLM_DATA_DIR/adapters/.deleting"/source_stage "$DEPTSLM_DATA_DIR/adapters/.deleting"/source_final "$DEPTSLM_DATA_DIR/adapters/.deleting"/registry_stage "$DEPTSLM_DATA_DIR/adapters/.deleting"/registry_final "$DEPTSLM_DATA_DIR/adapters/.purge-deleting"/source_stage "$DEPTSLM_DATA_DIR/adapters/.purge-deleting"/source_final "$DEPTSLM_DATA_DIR/adapters/.purge-deleting"/registry_stage "$DEPTSLM_DATA_DIR/adapters/.purge-deleting"/registry_final
          find "$DEPTSLM_DATA_DIR/adapters" -type d -exec chmod 700 {} +
          for attempt in {1..30}; do
            if curl --fail --silent --header "api-key: $DEPTSLM_TEST_QDRANT_API_KEY" "$DEPTSLM_TEST_QDRANT_URL/healthz" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Qdrant did not become healthy." >&2
              exit 1
            fi
            sleep 1
          done
          python -m alembic upgrade head
          test "$(python -m alembic current | awk '{print $1}')" = "0014_phase12_adapter_purge"
          python -m pytest
      - name: Run one-shot worker smoke test
        working-directory: apps/api
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-worker-smoke"
          mkdir -p "$DEPTSLM_DATA_DIR/uploads" "$DEPTSLM_DATA_DIR/extracted_text"
          python -m deptslm_worker --once
      - name: Run one-shot indexing worker smoke test with fake embeddings
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DEPTSLM_QDRANT_URL: http://localhost:6333
          DEPTSLM_QDRANT_API_KEY: phase6-ci-qdrant-key-0123456789
          DEPTSLM_QDRANT_COLLECTION: deptslm_chunks_qwen3_0_6b_1024_v1
          DEPTSLM_EMBEDDING_MODEL_REVISION: d23109d65ca9fdf61eef614209744716f337f50f
          DEPTSLM_EMBEDDING_PROVIDER: fake
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-indexer-smoke"
          mkdir -p "$DEPTSLM_DATA_DIR/extracted_text" "$DEPTSLM_DATA_DIR/model_cache"
          python -m deptslm_worker.vector_admin bootstrap
          python -m deptslm_worker.indexer --once
      - name: Run one-shot evaluator worker smoke test
        working-directory: apps/api
        env:
          ENVIRONMENT: test
          DEPTSLM_QDRANT_URL: http://localhost:6333
          DEPTSLM_QDRANT_API_KEY: phase6-ci-qdrant-key-0123456789
          DEPTSLM_QDRANT_COLLECTION: deptslm_chunks_qwen3_0_6b_1024_v1
          DEPTSLM_RAG_RUNTIME_URL: http://localhost:8010
          DEPTSLM_RAG_RUNTIME_TOKEN: phase9-ci-runtime-token-0123456789-abcdef
          DEPTSLM_EVALUATION_WORKER_ID: 00000000-0000-0000-0000-000000000009
          DEPTSLM_EVALUATION_CODE_REVISION: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-evaluator-smoke"
          mkdir -p "$DEPTSLM_DATA_DIR/extracted_text" "$DEPTSLM_DATA_DIR/eval_results"
          python -m deptslm_worker.evaluator --once
      - name: Run one-shot SFT dataset builder smoke test
        working-directory: apps/api
        env:
          DEPTSLM_SFT_WORKER_ID: 00000000-0000-0000-0000-000000000010
          DEPTSLM_SFT_CODE_REVISION: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-sft-smoke"
          mkdir -p "$DEPTSLM_DATA_DIR/training_datasets"
          python -m app.sft_worker
      - name: Run one-shot Phase 11 training-job worker smoke test
        working-directory: apps/api
        env:
          DEPTSLM_TRAINING_JOB_WORKER_ID: 00000000-0000-0000-0000-000000000011
          DEPTSLM_TRAINING_JOB_CODE_REVISION: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-training-job-smoke"
          mkdir -p "$DEPTSLM_DATA_DIR/training_datasets"
          python -m app.training_job_worker
      - name: Run one-shot Phase 12.1C adapter registry worker smoke test
        working-directory: apps/api
        env:
          DEPTSLM_ADAPTER_REGISTRY_WORKER_ID: 00000000-0000-0000-0000-000000000012
          DEPTSLM_ADAPTER_REGISTRY_CODE_REVISION: cccccccccccccccccccccccccccccccccccccccc
        run: |
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-adapter-registry-smoke"
          mkdir -p "$DEPTSLM_DATA_DIR/adapters"/{imports,registry,.staging/imports,.staging/registry}
          mkdir -p "$DEPTSLM_DATA_DIR/training_datasets/jobs"
          python -m app.adapter_registry_worker
      - name: Verify API checks leave the checkout clean
        shell: bash
        run: |
          status_file="${RUNNER_TEMP}/git-status"
          git status --porcelain --untracked-files=all > "${status_file}"
          if [[ -s "${status_file}" ]]; then
            cat "${status_file}" >&2
            exit 1
          fi

  infrastructure:
    name: Infrastructure static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n scripts/setup_google_drive_storage.sh
          bash -n scripts/validate_data_dir.sh
          bash -n scripts/compose.sh
          sh -n services/rag-worker/entrypoint.sh
          sh -n services/training-worker/entrypoint.sh
          sh -n services/training-job-worker/entrypoint.sh
          sh -n services/adapter-registry-worker/entrypoint.sh
          sh -n services/adapter-maintenance/entrypoint.sh
      - name: Check required infrastructure files and permissions
        run: |
          test -s docker-compose.yml
          test -x scripts/setup_google_drive_storage.sh
          test -x scripts/validate_data_dir.sh
          test -x scripts/compose.sh
          test -x services/rag-worker/entrypoint.sh
          test -x services/training-worker/entrypoint.sh
          test -x services/training-job-worker/entrypoint.sh
          test -x services/adapter-registry-worker/entrypoint.sh
          test -x services/adapter-maintenance/entrypoint.sh
      - name: Build and inspect API migration image
        run: |
          docker build --tag deptslm-api-ci --file apps/api/Dockerfile .
          docker run --rm --entrypoint python deptslm-api-ci -c '
          import pathlib
          import app.admin
          import app.adapter_purge
          import app.document_storage
          import app.document_upload
          import app.main
          assert pathlib.Path("/app/alembic.ini").is_file()
          assert pathlib.Path("/app/alembic/versions/0001_phase3_schema.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0002_phase4_documents.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0003_phase5_extraction.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0004_phase6_vector_indexing.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0005_phase7_rag_answers.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0006_phase8_rag_feedback.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0007_phase9_evaluation_runner.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0008_phase10_sft_dataset_builder.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0009_phase11_training_jobs.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0010_phase12_adapter_sources.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0011_phase12_adapter_registry.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0012_phase12_adapter_reconciliation.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0013_phase12_adapter_reconciliation_cursor.py").is_file()
          assert pathlib.Path("/app/alembic/versions/0014_phase12_adapter_purge.py").is_file()
          import app.evaluation_admin
          import app.evaluation_services
          import app.sft_services
          import app.training_job_services
          import importlib.util
          assert importlib.util.find_spec("pypdf") is None
          assert importlib.util.find_spec("qdrant_client") is not None
          assert importlib.util.find_spec("sentence_transformers") is None
          assert importlib.util.find_spec("transformers") is None
          '
      - name: Build and inspect SFT dataset builder image
        run: |
          docker build --tag deptslm-sft-worker-ci --file services/training-worker/Dockerfile .
          docker run --rm --entrypoint python deptslm-sft-worker-ci -I -c '
          import importlib.util
          import app.sft_queue
          import app.sft_worker
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("transformers") is None
          assert importlib.util.find_spec("qdrant_client") is None
          assert importlib.util.find_spec("sentence_transformers") is None
          assert importlib.util.find_spec("huggingface_hub") is None
          '
      - name: Build and inspect Phase 11 training-job image
        run: |
          docker build --tag deptslm-training-job-worker-ci --file services/training-job-worker/Dockerfile .
          docker run --rm --entrypoint python deptslm-training-job-worker-ci -I -c '
          import importlib.util
          import app.training_job_child
          import app.training_job_queue
          import app.training_job_worker
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("transformers") is None
          assert importlib.util.find_spec("qdrant_client") is None
          assert importlib.util.find_spec("sentence_transformers") is None
          assert importlib.util.find_spec("huggingface_hub") is None
          '
      - name: Build and inspect Phase 12.1C adapter registry image
        run: |
          docker build --tag deptslm-adapter-registry-worker-ci --file services/adapter-registry-worker/Dockerfile .
          docker run --rm --entrypoint python deptslm-adapter-registry-worker-ci -I -c '
          import importlib.util
          import app.adapter_registry_child
          import app.adapter_registry_domain
          import app.adapter_registry_queue
          import app.adapter_registry_worker
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("transformers") is None
          assert importlib.util.find_spec("qdrant_client") is None
          assert importlib.util.find_spec("sentence_transformers") is None
          assert importlib.util.find_spec("huggingface_hub") is None
          '
          weight_matches="$(docker run --rm --entrypoint sh deptslm-adapter-registry-worker-ci -c 'find / -type f \( -name "*.safetensors" -o -name "*.bin" -o -name "*.gguf" -o -name "*.pt" -o -name "*.pth" \) -print 2>/dev/null || true')"
          if [[ -n "$weight_matches" ]]; then
            printf 'Forbidden model-weight-like files in adapter registry image:\n%s\n' "$weight_matches" >&2
            exit 1
          fi
      - name: Build and inspect Phase 12.1E-A maintenance image
        run: |
          docker build --tag deptslm-adapter-maintenance-ci --file services/adapter-maintenance/Dockerfile .
          docker run --rm --entrypoint python deptslm-adapter-maintenance-ci -I -c '
          import importlib.util
          import app.adapter_artifact_maintenance
          import app.adapter_maintenance_artifacts
          import app.adapter_purge
          import app.adapter_lifecycle_release
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("transformers") is None
          assert importlib.util.find_spec("qdrant_client") is None
          assert importlib.util.find_spec("sentence_transformers") is None
          assert importlib.util.find_spec("huggingface_hub") is None
          assert importlib.util.find_spec("peft") is None
          '
          weight_matches="$(docker run --rm --entrypoint sh deptslm-adapter-maintenance-ci -c 'find / -type f \( -name "*.safetensors" -o -name "*.bin" -o -name "*.gguf" -o -name "*.pt" -o -name "*.pth" \) -print 2>/dev/null || true')"
          if [[ -n "$weight_matches" ]]; then
            printf 'Forbidden model-weight-like files in adapter maintenance image:\n%s\n' "$weight_matches" >&2
            exit 1
          fi
      - name: Build and inspect extraction worker image
        run: |
          docker build --target extraction --tag deptslm-rag-worker-ci --file services/rag-worker/Dockerfile .
          docker run --rm --entrypoint python deptslm-rag-worker-ci -I -c '
          import importlib.util
          import pypdf
          import deptslm_worker
          import deptslm_worker.extraction_runner
          import deptslm_worker.queue
          assert tuple(int(part) for part in pypdf.__version__.split(".")[:2]) >= (6, 14)
          assert importlib.util.find_spec("qdrant_client") is None
          assert importlib.util.find_spec("sentence_transformers") is None
          '
      - name: Build and inspect indexing worker image
        run: |
          docker build --target indexing --tag deptslm-indexing-worker-ci --file services/rag-worker/Dockerfile .
          docker run --rm --entrypoint python deptslm-indexing-worker-ci -I -c '
          import importlib.util
          import deptslm_worker.indexer
          import deptslm_worker.qdrant_adapter
          import qdrant_client
          import sentence_transformers
          assert importlib.util.find_spec("llama_index") is None
          '
          # setuptools installs this Python import-path configuration file; it is not a model artifact.
          weight_matches="$(docker run --rm --entrypoint sh deptslm-indexing-worker-ci -c 'find / -type f \( -name "*.safetensors" -o -name "*.bin" -o -name "*.gguf" -o -name "*.pt" -o -name "*.pth" \) ! -path "/usr/local/lib/python3.12/site-packages/distutils-precedence.pth" -print 2>/dev/null || true')"
          if [[ -n "$weight_matches" ]]; then
            printf 'Forbidden model-weight-like files in indexing image:\n%s\n' "$weight_matches" >&2
            exit 1
          fi
      - name: Build and inspect evaluator worker image
        run: |
          docker build --target evaluator --tag deptslm-evaluator-worker-ci --file services/rag-worker/Dockerfile .
          docker run --rm --entrypoint python deptslm-evaluator-worker-ci -I -c '
          import importlib.util
          import deptslm_worker.evaluator
          import deptslm_worker.evaluation_pipeline
          import deptslm_worker.evaluation_queue
          import qdrant_client
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("transformers") is None
          assert importlib.util.find_spec("sentence_transformers") is None
          assert importlib.util.find_spec("huggingface_hub") is None
          '
          weight_matches="$(docker run --rm --entrypoint sh deptslm-evaluator-worker-ci -c 'find / -type f \( -name "*.safetensors" -o -name "*.bin" -o -name "*.gguf" -o -name "*.pt" -o -name "*.pth" \) ! -path "/usr/local/lib/python3.12/site-packages/distutils-precedence.pth" -print 2>/dev/null || true')"
          if [[ -n "$weight_matches" ]]; then
            printf 'Forbidden model-weight-like files in evaluator image:\n%s\n' "$weight_matches" >&2
            exit 1
          fi
      - name: Build and inspect internal RAG runtime image
        run: |
          docker build --tag deptslm-rag-runtime-ci --file services/rag-runtime/Dockerfile .
          docker run --rm --entrypoint python deptslm-rag-runtime-ci -I -c '
          import importlib.util
          import deptslm_runtime.model_child
          import deptslm_runtime.main
          import deptslm_runtime.supervisor
          import sentence_transformers
          import transformers
          assert importlib.util.find_spec("qdrant_client") is None
          assert importlib.util.find_spec("psycopg") is None
          '
          weight_matches="$(docker run --rm --entrypoint sh deptslm-rag-runtime-ci -c 'find / -type f \( -name "*.safetensors" -o -name "*.bin" -o -name "*.gguf" -o -name "*.pt" -o -name "*.pth" \) ! -path "/usr/local/lib/python3.12/site-packages/distutils-precedence.pth" -print 2>/dev/null || true')"
          if [[ -n "$weight_matches" ]]; then
            printf 'Forbidden model-weight-like files in RAG runtime image:\n%s\n' "$weight_matches" >&2
            exit 1
          fi
          runtime_data="$RUNNER_TEMP/deptslm-rag-runtime"
          mkdir -p "$runtime_data/model_cache"
          container_id="$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18010:8010 \
            --volume "$runtime_data/model_cache:/runtime/deptslm/model_cache:ro" \
            --env DEPTSLM_DATA_DIR=/runtime/deptslm \
            --env DEPTSLM_RAG_RUNTIME_TOKEN=phase7-ci-runtime-token-0123456789-abcdef \
            --env DEPTSLM_RAG_RUNTIME_PROVIDER=fake \
            --env DEPTSLM_RAG_RUNTIME_MAX_CONCURRENCY=1 \
            --env DEPTSLM_EMBEDDING_MODEL_REVISION=d23109d65ca9fdf61eef614209744716f337f50f \
            --env DEPTSLM_GENERATION_MODEL_REVISION=c1899de289a04d12100db370d81485cdf75e47ca \
            --env ENVIRONMENT=test \
            deptslm-rag-runtime-ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18010/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "RAG runtime fake smoke test did not become ready." >&2
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent \
            --header 'Authorization: Bearer phase7-ci-runtime-token-0123456789-abcdef' \
            --header 'Content-Type: application/json' \
            --data '{"question":"Synthetic runtime smoke?"}' \
            http://127.0.0.1:18010/internal/v1/query-embedding \
            | python -c 'import json,sys; value=json.load(sys.stdin); assert len(value["vector"]) == 1024'
          docker rm --force "$container_id" >/dev/null
          trap - EXIT
      - name: Check raw streaming upload boundary
        run: |
          ! grep -R -E 'UploadFile|python-multipart|request\.body\(' apps/api/app apps/api/requirements*.txt
      - name: Check Phase 5 extraction isolation
        run: |
          ! grep -E -i 'qdrant|transformers|sentence_transformers|huggingface_hub' services/rag-worker/deptslm_worker/{__main__,pipeline,queue,extractor,extraction_runner}.py
          ! grep -R -E -i 'llamaindex|llama_index|pytesseract|easyocr' services/rag-worker/deptslm_worker services/rag-worker/pyproject.toml
          ! git ls-files | grep -E '(^|/)(normalized\.txt|chunks\.jsonl|manifest\.json)$'
      - name: Check Phase 6 architecture boundaries
        run: |
          ! grep -E 'QdrantClient|qdrant_client' apps/api/app/routes.py
          test "$(grep -R -l 'QdrantClient' services/rag-worker/deptslm_worker --include='*.py' | sort)" = "services/rag-worker/deptslm_worker/qdrant_adapter.py"
          ! grep -E '@router\.(get|post).*search|/search|query_vector' apps/api/app/routes.py
          ! grep -E 'qdrant/qdrant:(latest|main)' docker-compose.yml .github/workflows/ci.yml
          grep -R -F 'd23109d65ca9fdf61eef614209744716f337f50f' apps/api/app services/rag-worker/deptslm_worker >/dev/null
      - name: Check Phase 7 architecture boundaries
        run: |
          ! grep -E '@router\.(get|post).*search|/search|query_vector' apps/api/app/routes.py apps/api/app/schemas.py
          ! sed -n '/^  rag-runtime:/,/^  training-worker:/p' docker-compose.yml | grep -E 'DATABASE(_TEST)?_URL|DEPTSLM_QDRANT_(URL|API_KEY)|DEPTSLM_AUTH_|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|HTTP_PROXY|HTTPS_PROXY|ALL_PROXY|NO_PROXY'
          ! grep -R -E 'dangerouslySetInnerHTML|localStorage|sessionStorage' apps/web/app
          test "$(grep -R -l 'QdrantClient' services/rag-worker/deptslm_worker apps/api/app --include='*.py' | sort)" = "services/rag-worker/deptslm_worker/qdrant_adapter.py"
          grep -R -F 'c1899de289a04d12100db370d81485cdf75e47ca' apps/api/app services/rag-runtime services/rag-worker/deptslm_worker >/dev/null
          grep -R -F 'DEPTSLM_RAG_RUNTIME_TOKEN' services/rag-runtime/deptslm_runtime/settings.py >/dev/null
          grep -R -F 'GENERATION_MODEL_CONTEXT_TOKENS = 40960' apps/api/app/rag_domain.py >/dev/null
          grep -R -F 'MAX_GENERATION_INPUT_TOKENS = 8192' apps/api/app/rag_domain.py >/dev/null
      - name: Check Phase 8 feedback isolation
        run: |
          ! grep -E -i 'qdrant|RagRuntimeClient|Phase5ArtifactReader|selected_chunk_reader|torch|transformers|sentence_transformers|model_store' apps/api/app/rag_feedback_*.py
          ! grep -E 'from app\.settings import|from app import settings|import app\.settings|DEPTSLM_DATA_DIR|DocumentStorage|RagSettings|Qdrant|model_cache|uploads|extracted_text' apps/api/app/feedback_purge.py
          grep -F 'FeedbackPurgeSettings.from_environment()' apps/api/app/admin.py >/dev/null
          grep -F 'FEEDBACK_SUBMIT_BODY_MAX_BYTES = 4096' apps/api/app/feedback_request_body.py >/dev/null
          grep -F 'FEEDBACK_REVIEW_BODY_MAX_BYTES = 2048' apps/api/app/feedback_request_body.py >/dev/null
          grep -F 'func.statement_timestamp()' apps/api/app/rag_feedback_services.py >/dev/null
          ! grep -R -E 'dangerouslySetInnerHTML|localStorage|sessionStorage|indexedDB' apps/web/app
          ! grep -R -E '<textarea|type="text"' apps/web/app/components/RagFeedbackPanel.tsx apps/web/app/components/FeedbackReviewQueue.tsx
          ! grep -E '@router\.(get|post).*search|/search|query_vector' apps/api/app/routes.py apps/api/app/schemas.py
      - name: Check Phase 9 evaluation isolation
        run: |
          ! grep -E -i 'rag_answer_feedback|rag_feedback_services|feedback_purge' apps/api/app/evaluation_*.py services/rag-worker/deptslm_worker/evaluation_*.py
          ! grep -E -i 'torch|transformers|sentence_transformers|huggingface_hub|model_store' services/rag-worker/deptslm_worker/evaluation_*.py
          ! grep -E 'QdrantClient|qdrant_client' services/rag-worker/deptslm_worker/evaluation_*.py
          ! grep -E '@router\.(get|post).*evaluation.*(cases|artifact|download)' apps/api/app/routes.py
          ! grep -E '@router\.(get|post).*search|/search|query_vector' apps/api/app/routes.py apps/api/app/schemas.py
          grep -F 'execute_rag_policy' apps/api/app/rag_answer_services.py services/rag-worker/deptslm_worker/evaluation_pipeline.py >/dev/null
          grep -F '_supervise_suite_load' services/rag-worker/deptslm_worker/evaluation_pipeline.py >/dev/null
          grep -F '_supervise_authority' services/rag-worker/deptslm_worker/evaluation_pipeline.py >/dev/null
          grep -F 'revalidate_canonical_suite_authority_in_transaction' services/rag-worker/deptslm_worker/evaluation_queue.py >/dev/null
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -F '/eval_results' <<<"$api_compose"
          ! grep -F 'eval_results' apps/api/Dockerfile
          evaluator_compose="$(sed -n '/^  evaluator-worker:/,/^  model-admin:/p' docker-compose.yml)"
          ! grep -E 'uploads|model_cache|training_datasets|adapters|exports|HF_TOKEN|HUGGING_FACE_HUB_TOKEN' <<<"$evaluator_compose"
          grep -F '/extracted_text' <<<"$evaluator_compose" >/dev/null
          grep -F 'read_only: true' <<<"$evaluator_compose" >/dev/null
          grep -F '/eval_results' <<<"$evaluator_compose" >/dev/null
          for service in rag-runtime rag-worker indexing-worker; do
            block="$(sed -n "/^  ${service}:/,/^  [a-z][a-z-]*:/p" docker-compose.yml)"
            ! grep -F '/eval_results' <<<"$block"
          done
      - name: Check Phase 10 SFT dataset isolation
        run: |
          ! grep -R -E -i 'qdrant|rag_runtime|feedback|evaluation|transformers|torch|huggingface|llama.?factory|adapter' apps/api/app/sft_*.py
          ! grep -E '@router\.(get|post).*sft.*(artifact|download|content)' apps/api/app/routes.py
          ! grep -R -E 'localStorage|sessionStorage|indexedDB|serviceWorker' apps/web/app/components/SftDatasetPanel.tsx
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -F '/training_datasets' <<<"$api_compose"
          sft_compose="$(sed -n '/^  training-worker:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F '/training_datasets' <<<"$sft_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|eval_results|model_cache|adapters|exports|DEPTSLM_QDRANT|DEPTSLM_RAG|DEPTSLM_AUTH|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$sft_compose"
      - name: Check Phase 11 training-job isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|app\.evaluation|app\.rag_feedback)' apps/api/app/training_job_*.py
          ! grep -E '@router\.(get|post).*training.*(artifact|download|content|config)' apps/api/app/routes.py
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -F '/training_datasets' <<<"$api_compose"
          job_compose="$(sed -n '/^  training-job-worker:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F '/training_datasets' <<<"$job_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|eval_results|model_cache|adapters|exports|DEPTSLM_QDRANT|DEPTSLM_RAG|DEPTSLM_AUTH|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$job_compose"
      - name: Check Phase 12.1C adapter registry isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|app\.evaluation|app\.rag_feedback)' apps/api/app/adapter_registry_*.py
          ! grep -n -A6 -E '@router\.(post|put|patch|delete)' apps/api/app/routes.py | grep -E '/departments/\{department_id\}/adapters'
          registry_compose="$(sed -n '/^  adapter-registry-worker:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F '/adapters/imports' <<<"$registry_compose" >/dev/null
          grep -F '/training_datasets' <<<"$registry_compose" >/dev/null
          grep -F '/adapters/registry' <<<"$registry_compose" >/dev/null
          grep -F '/adapters/.staging/registry' <<<"$registry_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|eval_results|model_cache|vector_snapshots|exports|rag-internal|DEPTSLM_QDRANT|DEPTSLM_RAG|DEPTSLM_AUTH|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$registry_compose"
          grep -F 'AdapterRegistryArtifactStore' apps/api/app/adapter_registry_queue.py >/dev/null
          grep -F 'training_provenance_verified = False' apps/api/app/adapter_registry_queue.py >/dev/null
      - name: Check Phase 12.1D metadata-read isolation
        run: |
          grep -F 'from app.adapter_registry_read_services import list_adapters, read_adapter' apps/api/app/routes.py >/dev/null
          ! grep -E '^(from|import) (adapter_registry_artifacts|adapter_source_artifacts|torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory)' apps/api/app/adapter_registry_read_services.py
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -E '/adapters|adapters/' <<<"$api_compose"
          ! grep -E '@router\.(post|put|patch|delete)' apps/api/app/routes.py | grep -E '/departments/\{department_id\}/adapters'
          grep -F 'AdapterMetadataListResponse' apps/api/app/routes.py >/dev/null
          grep -F 'AdapterMetadataResponse' apps/api/app/routes.py >/dev/null
      - name: Check Phase 12.1E-A maintenance isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory)' apps/api/app/adapter_artifact_maintenance.py apps/api/app/adapter_maintenance_artifacts.py apps/api/app/adapter_purge.py
          maintenance_compose="$(sed -n '/^  adapter-maintenance:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F 'profiles: ["maintenance"]' <<<"$maintenance_compose" >/dev/null
          grep -F '/adapters' <<<"$maintenance_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|training_datasets|model_cache|eval_results|qdrant|rag|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$maintenance_compose"
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -E '/adapters|adapters/' <<<"$api_compose"
      - name: Check Phase 12.1E-B purge isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory|app\.rag|app\.evaluation)' apps/api/app/adapter_purge.py
          purge_compose="$(sed -n '/^  adapter-maintenance:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F 'profiles: ["maintenance"]' <<<"$purge_compose" >/dev/null
          grep -F '/adapters' <<<"$purge_compose" >/dev/null
          ! grep -E 'qdrant|rag|model_cache|training_datasets|uploads|extracted_text|eval_results|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$purge_compose"
          grep -F '.purge-deleting' scripts/setup_google_drive_storage.sh scripts/validate_data_dir.sh services/adapter-maintenance/entrypoint.sh >/dev/null
          ! grep -E '@router\.(get|post|put|patch|delete).*purge' apps/api/app/routes.py
          grep -F 'AdapterPurgeArtifactStore' apps/api/app/adapter_purge.py >/dev/null
          grep -F 'AdapterPurgeOperation' apps/api/app/adapter_purge.py >/dev/null
      - name: Check Phase 12.1E-C lifecycle-release isolation
        run: |
          if grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory|app\.rag|app\.evaluation|app\.sft_|app\.training_job_)' apps/api/app/adapter_lifecycle_release.py; then exit 1; fi
          if grep -E 'move_verified_surface_to_tombstone|unlink_committed_tombstone_entry|remove_committed_tombstone_directory|recover_authorized_move|open_committed_tombstone' apps/api/app/adapter_lifecycle_release.py; then exit 1; fi
          grep -F 'AdapterPurgeArtifactStore' apps/api/app/adapter_lifecycle_release.py >/dev/null
          grep -F 'assert_tombstone_namespace_empty' apps/api/app/adapter_lifecycle_release.py >/dev/null
          grep -F 'adapter.upstream_dependency.release' apps/api/app/adapter_lifecycle_release.py >/dev/null
          grep -F 'release-adapter-upstream-dependency' apps/api/app/admin.py >/dev/null
          if grep -E '@router\.(get|post|put|patch|delete).*release' apps/api/app/routes.py; then exit 1; fi
          release_compose="$(sed -n '/^  adapter-maintenance:/,/^networks:/p' docker-compose.yml)"
          grep -F 'profiles: ["maintenance"]' <<<"$release_compose" >/dev/null
          grep -F '/adapters' <<<"$release_compose" >/dev/null
          if grep -E 'qdrant|rag-internal|model_cache|training_datasets|uploads|extracted_text|eval_results|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$release_compose"; then exit 1; fi
      - name: Validate Compose configuration when available
        run: |
          if docker compose version >/dev/null 2>&1; then
            export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-data"
            export DEPTSLM_QDRANT_API_KEY="phase6-ci-compose-key-0123456789"
            export DEPTSLM_RAG_RUNTIME_TOKEN="phase7-ci-runtime-token-0123456789-abcdef"
            export DEPTSLM_EVALUATION_CODE_REVISION="9999999999999999999999999999999999999999"
            export DEPTSLM_SFT_CODE_REVISION="8888888888888888888888888888888888888888"
            export DEPTSLM_TRAINING_JOB_CODE_REVISION="7777777777777777777777777777777777777777"
            export DEPTSLM_ADAPTER_REGISTRY_CODE_REVISION="6666666666666666666666666666666666666666"
            mkdir -p "$DEPTSLM_DATA_DIR"/{uploads,extracted_text,vector_snapshots,training_datasets,adapters,model_cache,eval_results,logs,exports}
            mkdir -p "$DEPTSLM_DATA_DIR/training_datasets/jobs"
            mkdir -p "$DEPTSLM_DATA_DIR"/adapters/{imports,registry,.staging/imports,.staging/registry}
            mkdir -p "$DEPTSLM_DATA_DIR"/adapters/.deleting/{source_stage,source_final,registry_stage,registry_final}
            mkdir -p "$DEPTSLM_DATA_DIR"/adapters/.purge-deleting/{source_stage,source_final,registry_stage,registry_final}
            mkdir -p "$DEPTSLM_DATA_DIR/service_state/postgres"
            mkdir -p "$DEPTSLM_DATA_DIR/service_state/qdrant"
            ./scripts/compose.sh config --quiet
          else
            echo "Docker Compose unavailable; skipping Compose configuration validation."
          fi
      - name: Verify infrastructure checks leave the checkout clean
        shell: bash
        run: |
          status_file="${RUNNER_TEMP}/git-status"
          git status --porcelain --untracked-files=all > "${status_file}"
          if [[ -s "${status_file}" ]]; then
            cat "${status_file}" >&2
            exit 1
          fi
