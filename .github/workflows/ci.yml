          ! grep -E '@router\.(get|post).*search|/search|query_vector' apps/api/app/routes.py apps/api/app/schemas.py
          grep -F 'execute_rag_policy' apps/api/app/rag_answer_services.py services/rag-worker/deptslm_worker/evaluation_pipeline.py >/dev/null
          grep -F '_supervise_suite_load' services/rag-worker/deptslm_worker/evaluation_pipeline.py >/dev/null
          grep -F '_supervise_authority' services/rag-worker/deptslm_worker/evaluation_pipeline.py >/dev/null
          grep -F 'revalidate_canonical_suite_authority_in_transaction' services/rag-worker/deptslm_worker/evaluation_queue.py >/dev/null
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -F '/eval_results' <<<"$api_compose"
          ! grep -F 'eval_results' apps/api/Dockerfile
          evaluator_compose="$(sed -n '/^  evaluator-worker:/,/^  model-admin:/p' docker-compose.yml)"
          ! grep -E 'uploads|model_cache|training_datasets|adapters|exports|HF_TOKEN|HUGGING_FACE_HUB_TOKEN' <<<"$evaluator_compose"
          grep -F '/extracted_text' <<<"$evaluator_compose" >/dev/null
          grep -F 'read_only: true' <<<"$evaluator_compose" >/dev/null
          grep -F '/eval_results' <<<"$evaluator_compose" >/dev/null
          for service in rag-runtime rag-worker indexing-worker; do
            block="$(sed -n "/^  ${service}:/,/^  [a-z][a-z-]*:/p" docker-compose.yml)"
            ! grep -F '/eval_results' <<<"$block"
          done
      - name: Check Phase 10 SFT dataset isolation
        run: |
          ! grep -R -E -i 'qdrant|rag_runtime|feedback|evaluation|transformers|torch|huggingface|llama.?factory|adapter' apps/api/app/sft_*.py
          ! grep -E '@router\.(get|post).*sft.*(artifact|download|content)' apps/api/app/routes.py
          ! grep -R -E 'localStorage|sessionStorage|indexedDB|serviceWorker' apps/web/app/components/SftDatasetPanel.tsx
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -F '/training_datasets' <<<"$api_compose"
          sft_compose="$(sed -n '/^  training-worker:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F '/training_datasets' <<<"$sft_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|eval_results|model_cache|adapters|exports|DEPTSLM_QDRANT|DEPTSLM_RAG|DEPTSLM_AUTH|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$sft_compose"
      - name: Check Phase 11 training-job isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|app\.evaluation|app\.rag_feedback)' apps/api/app/training_job_*.py
          ! grep -E '@router\.(get|post).*training.*(artifact|download|content|config)' apps/api/app/routes.py
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -F '/training_datasets' <<<"$api_compose"
          job_compose="$(sed -n '/^  training-job-worker:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F '/training_datasets' <<<"$job_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|eval_results|model_cache|adapters|exports|DEPTSLM_QDRANT|DEPTSLM_RAG|DEPTSLM_AUTH|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$job_compose"
      - name: Check Phase 12.1C adapter registry isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|app\.evaluation|app\.rag_feedback)' apps/api/app/adapter_registry_*.py
          if grep -n -A6 -E '@router\.(post|put|patch|delete)' apps/api/app/routes.py | grep -E '/departments/\{department_id\}/adapters' | grep -v -E '/evaluations|/review|/promote|/rollback'; then
            exit 1
          fi
          registry_compose="$(sed -n '/^  adapter-registry-worker:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F '/adapters/imports' <<<"$registry_compose" >/dev/null
          grep -F '/training_datasets' <<<"$registry_compose" >/dev/null
          grep -F '/adapters/registry' <<<"$registry_compose" >/dev/null
          grep -F '/adapters/.staging/registry' <<<"$registry_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|eval_results|model_cache|vector_snapshots|exports|rag-internal|DEPTSLM_QDRANT|DEPTSLM_RAG|DEPTSLM_AUTH|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$registry_compose"
          grep -F 'AdapterRegistryArtifactStore' apps/api/app/adapter_registry_queue.py >/dev/null
          grep -F 'training_provenance_verified = False' apps/api/app/adapter_registry_queue.py >/dev/null
      - name: Check Phase 12.1D metadata-read isolation
        run: |
          grep -F 'from app.adapter_registry_read_services import list_adapters, read_adapter' apps/api/app/routes.py >/dev/null
          ! grep -E '^(from|import) (adapter_registry_artifacts|adapter_source_artifacts|torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory)' apps/api/app/adapter_registry_read_services.py
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -E '/adapters|adapters/' <<<"$api_compose"
          if grep -n -A6 -E '@router\.(post|put|patch|delete)' apps/api/app/routes.py | grep -E '/departments/\{department_id\}/adapters' | grep -v -E '/evaluations|/review|/promote|/rollback'; then
            exit 1
          fi
          grep -F 'AdapterMetadataListResponse' apps/api/app/routes.py >/dev/null
          grep -F 'AdapterMetadataResponse' apps/api/app/routes.py >/dev/null
      - name: Check Phase 12.1E-A maintenance isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory)' apps/api/app/adapter_artifact_maintenance.py apps/api/app/adapter_maintenance_artifacts.py apps/api/app/adapter_purge.py
          maintenance_compose="$(sed -n '/^  adapter-maintenance:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F 'profiles: ["maintenance"]' <<<"$maintenance_compose" >/dev/null
          grep -F '/adapters' <<<"$maintenance_compose" >/dev/null
          ! grep -E 'uploads|extracted_text|training_datasets|model_cache|eval_results|qdrant|rag|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$maintenance_compose"
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -E '/adapters|adapters/' <<<"$api_compose"
      - name: Check Phase 12.1E-B purge isolation
        run: |
          ! grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory|app\.rag|app\.evaluation)' apps/api/app/adapter_purge.py
          purge_compose="$(sed -n '/^  adapter-maintenance:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F 'profiles: ["maintenance"]' <<<"$purge_compose" >/dev/null
          grep -F '/adapters' <<<"$purge_compose" >/dev/null
          ! grep -E 'qdrant|rag|model_cache|training_datasets|uploads|extracted_text|eval_results|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$purge_compose"
          grep -F '.purge-deleting' scripts/setup_google_drive_storage.sh scripts/validate_data_dir.sh services/adapter-maintenance/entrypoint.sh >/dev/null
          ! grep -E '@router\.(get|post|put|patch|delete).*purge' apps/api/app/routes.py
          grep -F 'AdapterPurgeArtifactStore' apps/api/app/adapter_purge.py >/dev/null
          grep -F 'AdapterPurgeOperation' apps/api/app/adapter_purge.py >/dev/null
      - name: Check Phase 12.1E-C lifecycle-release isolation
        run: |
          if grep -R -E '^(from|import) (torch|transformers|sentence_transformers|huggingface_hub|qdrant|safetensors|peft|llamafactory|app\.rag|app\.evaluation|app\.sft_|app\.training_job_)' apps/api/app/adapter_lifecycle_release.py; then exit 1; fi
          if grep -E 'move_verified_surface_to_tombstone|unlink_committed_tombstone_entry|remove_committed_tombstone_directory|recover_authorized_move|open_committed_tombstone' apps/api/app/adapter_lifecycle_release.py; then exit 1; fi
          grep -F 'AdapterPurgeArtifactStore' apps/api/app/adapter_lifecycle_release.py >/dev/null
          grep -F 'assert_tombstone_namespace_empty' apps/api/app/adapter_lifecycle_release.py >/dev/null
          grep -F 'adapter.upstream_dependency.release' apps/api/app/adapter_lifecycle_release.py >/dev/null
          grep -F 'release-adapter-upstream-dependency' apps/api/app/admin.py >/dev/null
          if grep -E '@router\.(get|post|put|patch|delete).*release' apps/api/app/routes.py; then exit 1; fi
          release_compose="$(sed -n '/^  adapter-maintenance:/,/^networks:/p' docker-compose.yml)"
          grep -F 'profiles: ["maintenance"]' <<<"$release_compose" >/dev/null
          grep -F '/adapters' <<<"$release_compose" >/dev/null
          if grep -E 'qdrant|rag-internal|model_cache|training_datasets|uploads|extracted_text|eval_results|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|PROXY' <<<"$release_compose"; then exit 1; fi
      - name: Check Phase 12.2 adapter evaluation isolation and paired policy
        run: |
          grep -F 'execute_paired_rag_case' apps/api/app/adapter_evaluation_policy.py services/rag-worker/deptslm_worker/adapter_evaluation_pipeline.py >/dev/null
          grep -F 'prepare_rag_policy_context' apps/api/app/adapter_evaluation_policy.py >/dev/null
          grep -F 'tags=["adapter-governance"]' apps/api/app/routes.py >/dev/null
          ! grep -E 'adapter_selector|deployment_pointer|production_adapter' apps/api/app/routes.py apps/api/app/schemas.py
          ! grep -E 'Mapped\[.*(question|accepted_answer|generated_answer|prompt|evidence_text|chunk_text|vector|adapter_bytes|path)' apps/api/app/models.py
          adapter_eval_compose="$(sed -n '/^  adapter-evaluator:/,/^  adapter-eval-runtime:/p' docker-compose.yml)"
          grep -F '/extracted_text' <<<"$adapter_eval_compose" >/dev/null
          grep -F '/eval_results' <<<"$adapter_eval_compose" >/dev/null
          ! grep -E 'model_cache|adapters|training_datasets|uploads|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|DEPTSLM_AUTH_SECRET' <<<"$adapter_eval_compose"
          candidate_compose="$(sed -n '/^  adapter-eval-runtime:/,/^  vector-admin:/p' docker-compose.yml)"
          grep -F '/model_cache' <<<"$candidate_compose" >/dev/null
          grep -F '/adapters/registry' <<<"$candidate_compose" >/dev/null
          ! grep -E 'DATABASE_URL|QDRANT|eval_results|training_datasets|uploads|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|DEPTSLM_AUTH_SECRET' <<<"$candidate_compose"
          grep -F 'phase12-adapter-evaluation-v1' apps/api/app/adapter_evaluation_domain.py >/dev/null
      - name: Check Phase 12.3 governance isolation and separate authorities
        run: |
          grep -F 'AdapterReview' apps/api/app/adapter_governance_services.py >/dev/null
          grep -F 'AdapterDeploymentOperation' apps/api/app/adapter_governance_worker.py >/dev/null
          ! grep -E 'approved|promoted|superseded|rejected' apps/api/app/models.py | grep -F 'Adapter.status'
          ! grep -E 'torch|transformers|sentence_transformers|huggingface_hub|qdrant|peft|llamaindex|llama_index' apps/api/app/adapter_governance_*.py
          governance_compose="$(sed -n '/^  adapter-governance-worker:/,/^  adapter-maintenance:/p' docker-compose.yml)"
          grep -F 'read_only: true' <<<"$governance_compose" >/dev/null
          grep -F '/adapters/registry' <<<"$governance_compose" >/dev/null
          grep -F 'DEPTSLM_STORAGE_READ_ONLY: "1"' <<<"$governance_compose" >/dev/null
          grep -F 'AdapterRegistryFinalReader' apps/api/app/adapter_governance_worker.py >/dev/null
          grep -F 'AdapterGovernanceWorkerSettings' apps/api/app/adapter_governance_worker.py >/dev/null
          grep -F 'run_adapter_governance_validation_child' apps/api/app/adapter_governance_worker.py >/dev/null
          grep -F 'parse_canonical_adapter_config' apps/api/app/adapter_governance_child.py >/dev/null
          grep -F 'validate_safetensors_metadata' apps/api/app/adapter_governance_child.py >/dev/null
          ! grep -E 'qdrant|model_cache|uploads|extracted_text|training_datasets|eval_results|exports|rag-internal|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|DEPTSLM_AUTH|PROXY' <<<"$governance_compose"
          ! grep -E '@router\.(get|post|put|patch|delete).*search|/search|query_vector' apps/api/app/routes.py
          ! grep -E 'adapter_selector|runtime_adapter|model_path|qdrant_url' apps/api/app/adapter_governance_*.py
          ! grep -R --include='*.py' -E 'DepartmentAdapterDeployment|adapter_selector|runtime_adapter|peft|PEFT' apps/api/app/adapter_evaluation_policy.py apps/api/app/adapter_evaluation_*.py services/rag-worker/deptslm_worker/adapter_evaluation_*.py services/rag-worker/deptslm_worker/evaluation_*.py
          grep -F 'Phase 12.4' docs/adapter-governance.md >/dev/null
      - name: Check Phase 12.4 runtime routing isolation
        run: |
          grep -F 'DepartmentAdapterDeployment' apps/api/app/rag_answer_services.py apps/api/app/adapter_deployment_authority.py >/dev/null
          grep -F 'RagAnswerRuntimeSnapshot' apps/api/app/rag_answer_services.py apps/api/app/models.py >/dev/null
          grep -F 'RoutedRagRuntime' apps/api/app/rag_answer_services.py >/dev/null
          grep -F 'query_embedding' apps/api/app/rag_runtime_router.py >/dev/null
          grep -F 'adapter_runtime_target_mismatch' apps/api/app/adapter_runtime_client.py apps/api/app/rag_domain.py >/dev/null
          runtime_sources="$(find services/adapter-runtime/deptslm_adapter_runtime -type f -name '*.py' ! -name settings.py -print)"
          if [[ -n "$runtime_sources" ]] && grep -E 'adapter-eval-runtime|DEPTSLM_ADAPTER_EVAL_RUNTIME_TOKEN' apps/api/app/rag_answer_services.py apps/api/app/adapter_runtime_client.py $runtime_sources; then
            exit 1
          fi
          grep -F 'DEPTSLM_ADAPTER_EVAL_RUNTIME_TOKEN' services/adapter-runtime/deptslm_adapter_runtime/settings.py >/dev/null
          ! grep -E 'adapter_selector|deployment_selector' apps/api/app/routes.py apps/api/app/schemas.py
          api_compose="$(sed -n '/^  api:/,/^  postgres:/p' docker-compose.yml)"
          ! grep -E '/adapters|adapters/|model_cache' <<<"$api_compose"
          rag_compose="$(sed -n '/^  rag-runtime:/,/^  adapter-runtime:/p' docker-compose.yml)"
          ! grep -E '/adapters|adapters/|peft|PEFT' <<<"$rag_compose"
          adapter_compose="$(sed -n '/^  adapter-runtime:/,/^  training-worker:/p' docker-compose.yml)"
          grep -F '/model_cache' <<<"$adapter_compose" >/dev/null
          grep -F '/adapters/registry' <<<"$adapter_compose" >/dev/null
          grep -F 'adapter-prod-internal' <<<"$adapter_compose" >/dev/null
          ! grep -E 'DATABASE_URL|QDRANT|DEPTSLM_AUTH|DEPTSLM_ADAPTER_EVAL|uploads|extracted_text|eval_results|training_datasets|exports|proxy|HF_TOKEN|HUGGING_FACE_HUB_TOKEN' <<<"$adapter_compose"
          ! grep -E '^\s+ports:' <<<"$adapter_compose"
          grep -F 'Phase 12.4' docs/adapter-runtime-routing.md >/dev/null
      - name: Check Phase 14.2 training runtime capability isolation
        run: |
          worker_compose="$(sed -n '/^  training-execution-worker:/,/^  training-runtime:/p' docker-compose.yml)"
          grep -F 'profiles: ["training"]' <<<"$worker_compose" >/dev/null
          grep -F 'postgres-internal' <<<"$worker_compose" >/dev/null
          grep -F '/training_runs' <<<"$worker_compose" >/dev/null
          grep -F 'training-runtime-ipc' <<<"$worker_compose" >/dev/null
          grep -F 'DEPTSLM_TRAINING_RUNTIME_TOKEN' <<<"$worker_compose" >/dev/null
          ! grep -E 'model_cache|QDRANT|RAG_RUNTIME|ADAPTER_RUNTIME|ADAPTER_EVAL|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|DEPTSLM_AUTH|docker.sock|ports:|network_mode:' <<<"$worker_compose"
          runtime_compose="$(sed -n '/^  training-runtime:/,/^  [a-z][a-z-]*:/p' docker-compose.yml)"
          grep -F 'profiles: ["training"]' <<<"$runtime_compose" >/dev/null
          grep -F 'network_mode: none' <<<"$runtime_compose" >/dev/null
          grep -F 'model_cache/qwen3-0.6b-c1899de289a04d12100db370d81485cdf75e47ca' <<<"$runtime_compose" >/dev/null
          grep -F 'training-runtime-ipc' <<<"$runtime_compose" >/dev/null
          grep -F 'read_only: true' <<<"$runtime_compose" >/dev/null
          grep -F 'cap_drop:' <<<"$runtime_compose" >/dev/null
          grep -F 'no-new-privileges:true' <<<"$runtime_compose" >/dev/null
          grep -F 'count: 1' <<<"$runtime_compose" >/dev/null
          grep -F 'size=256m' <<<"$runtime_compose" >/dev/null
          ! grep -E '^\s+DEPTSLM_DATA_DIR:|DATABASE_URL|training_runs|training_datasets|uploads|extracted_text|eval_results|adapters|QDRANT|RAG_RUNTIME|ADAPTER|HF_TOKEN|HUGGING_FACE_HUB_TOKEN|DEPTSLM_AUTH|docker.sock|ports:|networks:' <<<"$runtime_compose"
      - name: Validate Compose configuration when available
        run: |
          if docker compose version >/dev/null 2>&1; then
            export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-data"
            export DEPTSLM_QDRANT_API_KEY="phase6-ci-compose-key-0123456789"
            export DEPTSLM_RAG_RUNTIME_TOKEN="phase7-ci-runtime-token-0123456789-abcdef"
            export DEPTSLM_ADAPTER_RUNTIME_TOKEN="phase12-ci-production-runtime-token-0123456789"
            export DEPTSLM_ADAPTER_EVAL_RUNTIME_TOKEN="phase12-ci-adapter-runtime-token-0123456789"
            export DEPTSLM_TRAINING_EXECUTION_CODE_REVISION="5555555555555555555555555555555555555555"
            export DEPTSLM_TRAINING_DEPENDENCY_LOCK_SHA256="22e92e62895cdddc49ba6ab3545d2134dd6dbfb44616646b72cb09caa19cc5a5"
            export DEPTSLM_TRAINING_ENVIRONMENT_FINGERPRINT="123be4e6f366a28a0d56a7f51451397cdb05b5cb6a82a42ce66f487531c3978c"
            export DEPTSLM_TRAINING_RUNTIME_TOKEN="phase14-ci-training-runtime-token-0123456789"
            export DEPTSLM_EVALUATION_CODE_REVISION="9999999999999999999999999999999999999999"
            export DEPTSLM_SFT_CODE_REVISION="8888888888888888888888888888888888888888"
            export DEPTSLM_TRAINING_JOB_CODE_REVISION="7777777777777777777777777777777777777777"
            export DEPTSLM_ADAPTER_REGISTRY_CODE_REVISION="6666666666666666666666666666666666666666"
            mkdir -p "$DEPTSLM_DATA_DIR"/{uploads,extracted_text,vector_snapshots,training_datasets,adapters,model_cache,eval_results,logs,exports}
            mkdir -p "$DEPTSLM_DATA_DIR/training_datasets/jobs"
            mkdir -p "$DEPTSLM_DATA_DIR"/adapters/{imports,registry,.staging/imports,.staging/registry}
            mkdir -p "$DEPTSLM_DATA_DIR"/adapters/.deleting/{source_stage,source_final,registry_stage,registry_final}
            mkdir -p "$DEPTSLM_DATA_DIR"/adapters/.purge-deleting/{source_stage,source_final,registry_stage,registry_final}
            mkdir -p "$DEPTSLM_DATA_DIR/service_state/postgres"
            mkdir -p "$DEPTSLM_DATA_DIR/service_state/qdrant"
            ./scripts/compose.sh config --quiet
          else
            echo "Docker Compose unavailable; skipping Compose configuration validation."
          fi
      - name: Verify infrastructure checks leave the checkout clean
        shell: bash
        run: |
          status_file="${RUNNER_TEMP}/git-status"
          git status --porcelain --untracked-files=all > "${status_file}"
          if [[ -s "${status_file}" ]]; then
            cat "${status_file}" >&2
            exit 1
          fi

  phase13:
    name: Phase 13 security and demo gate
    needs: [repository-policy, web, api, infrastructure]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deptslm_test
          POSTGRES_PASSWORD: deptslm
          POSTGRES_USER: deptslm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deptslm -d deptslm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.13.4
        env:
          QDRANT__SERVICE__API_KEY: phase13-ci-qdrant-key-0123456789
        ports:
          - 6333:6333
    env:
      DATABASE_URL: postgresql+psycopg://deptslm:deptslm@localhost:5432/deptslm_test
      DATABASE_TEST_URL: postgresql+psycopg://deptslm:deptslm@localhost:5432/deptslm_test
      DEPTSLM_REQUIRE_POSTGRES_TESTS: "1"
      DEPTSLM_REQUIRE_QDRANT_TESTS: "1"
      DEPTSLM_TEST_QDRANT_URL: http://localhost:6333
      DEPTSLM_TEST_QDRANT_API_KEY: phase13-ci-qdrant-key-0123456789
      DEPTSLM_TEST_QDRANT_ISOLATED: "1"
      DEPTSLM_TRAINING_EXECUTION_CODE_REVISION: "5555555555555555555555555555555555555555"
      DEPTSLM_TRAINING_DEPENDENCY_LOCK_SHA256: "22e92e62895cdddc49ba6ab3545d2134dd6dbfb44616646b72cb09caa19cc5a5"
      DEPTSLM_TRAINING_ENVIRONMENT_PROFILE_ID: deptslm-phase14-training-runtime-linux-x86_64-cuda126-v1
      DEPTSLM_TRAINING_ENVIRONMENT_FINGERPRINT: "123be4e6f366a28a0d56a7f51451397cdb05b5cb6a82a42ce66f487531c3978c"
      DEPTSLM_TRAINING_RUNTIME_TOKEN: phase14-ci-training-runtime-token-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Verify Phase 14.2 runtime scope and migration head
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/security.md
          test -s docs/local-demo.md
          test -s docs/recovery.md
          test -x scripts/demo.sh
          test -f apps/api/alembic/versions/0018_phase14_training_execution_control_plane.py
          test -f apps/api/alembic/versions/0019_phase14_training_runtime.py
          ! find apps/api/alembic/versions -maxdepth 1 -type f -name '0020*' -print | grep -q .
          test -f services/training-runtime/Dockerfile
          test -s services/training-runtime/requirements.lock
          grep -F 'llamafactory==0.9.5' services/training-runtime/requirements.lock >/dev/null
          grep -F 'network_mode: none' docker-compose.yml >/dev/null
          grep -F 'profiles: ["training"]' docker-compose.yml >/dev/null
          grep -F 'DEPTSLM_TRAINING_RUNTIME_TOKEN' docker-compose.yml .env.example >/dev/null
          ! grep -R -E '@router\.(get|post|put|patch|delete).*search|/query-vector|/adapter(s)?/(upload|download)' apps/api/app/routes.py
      - name: Run Phase 13 transport and route-surface tests
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          export DEPTSLM_DATA_DIR="$RUNNER_TEMP/deptslm-phase13-data"
          mkdir -p "$DEPTSLM_DATA_DIR"/{uploads,extracted_text,vector_snapshots,training_datasets,adapters,model_cache,eval_results,logs,exports}
          mkdir -p "$DEPTSLM_DATA_DIR"/service_state/{postgres,qdrant}
          for attempt in {1..30}; do
            if curl --fail --silent --header "api-key: $DEPTSLM_TEST_QDRANT_API_KEY" "$DEPTSLM_TEST_QDRANT_URL/healthz" >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "Qdrant did not become healthy." >&2
              exit 1
            fi
            sleep 1
          done
          python -m alembic upgrade head
          test "$(python -m alembic current | awk '{print $1}')" = "0019_phase14_training_runtime"
          python -m pytest tests/test_phase13_security.py tests/test_phase13_integration.py tests/test_phase14_0_contract.py -q
      - name: Run synthetic Phase 13 Docker demo
        run: ./scripts/demo.sh
      - name: Verify the demo leaves the checkout clean
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
