          from pathlib import Path
          mount = Path("/runtime/deptslm/training_datasets")
          assert (mount / "mount-sentinel").read_text(encoding="ascii") == "compose-mount-sentinel\\n"
          assert any(
              len(parts := line.split()) > 5
