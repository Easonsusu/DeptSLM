name: Security audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    paths:
      - ".github/dependabot.yml"
      - ".gitleaks.toml"
      - ".github/workflows/**"
      - "**/requirements*.in"
      - "**/requirements*.lock"
      - "**/pyproject.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docker-compose*.yml"
      - "**/Dockerfile"
      - "scripts/security/**"

permissions:
  contents: read
  security-events: write

jobs:
  history-secrets:
    name: Full history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_NOTIFY_ISSUES: "false"
          GITLEAKS_REDACT: "true"

  python-audit:
    name: Python dependency audit report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-ci.lock
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.9.0"
      - name: Audit locked Python environments without exposing advisory values
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pip-audit"
          audit_status=0
          run_audit() {
            local status=0
            python -m pip_audit "$@" || status=$?
            if [[ "${status}" -gt "${audit_status}" ]]; then
              audit_status="${status}"
            fi
          }
          run_audit -r apps/api/requirements.lock --format json > "${RUNNER_TEMP}/pip-audit/api.json"
          run_audit -r apps/api/requirements-ci.lock --format json > "${RUNNER_TEMP}/pip-audit/ci.json"
          run_audit -r apps/api/requirements-worker.lock --format json > "${RUNNER_TEMP}/pip-audit/worker.json"
          run_audit -r services/rag-worker/requirements-extraction.lock --format json > "${RUNNER_TEMP}/pip-audit/extraction.json"
          run_audit -r services/rag-worker/requirements-indexing.lock --format json > "${RUNNER_TEMP}/pip-audit/indexing.json"
          run_audit -r services/rag-worker/requirements-vector.lock --format json > "${RUNNER_TEMP}/pip-audit/vector.json"
          run_audit -r services/adapter-runtime/requirements.lock --format json > "${RUNNER_TEMP}/pip-audit/adapter.json"
          run_audit -r services/adapter-eval-runtime/requirements.lock --format json > "${RUNNER_TEMP}/pip-audit/adapter-eval.json"
          run_audit -r services/rag-runtime/requirements.lock --format json > "${RUNNER_TEMP}/pip-audit/rag.json"
          run_audit -r services/training-runtime/requirements.lock --format json > "${RUNNER_TEMP}/pip-audit/training.json"
          if [[ "${audit_status}" -gt 1 ]]; then
            echo "pip-audit failed to produce one or more reports." >&2
            exit "${audit_status}"
          fi
          echo "pip-audit reports are uploaded; high/critical enforcement is handled by the applicable Trivy scan and exact documented model-runtime exception."
      - name: Upload Python audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-audit
          path: ${{ runner.temp }}/pip-audit
          if-no-files-found: ignore

  node-audit:
    name: Node dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fail on high or critical Node advisories
        run: pnpm audit --audit-level high

  filesystem-high:
    name: High and critical dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-files: apps/api/requirements-ci.lock,services/rag-worker/requirements-vector.lock
          skip-dirs: services/training-runtime,services/adapter-runtime,services/adapter-eval-runtime,services/rag-runtime
      - name: Report medium and low findings without blocking
        if: always()
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          severity: MEDIUM,LOW
          exit-code: "0"
          skip-files: apps/api/requirements-ci.lock
          format: table
