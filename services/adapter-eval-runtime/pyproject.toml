[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "deptslm-adapter-eval-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "PyJWT>=2.10.0,<3.0.0",
    "peft==0.18.1",
    "safetensors==0.7.0",
    "transformers==4.55.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["deptslm_adapter_runtime*"]
